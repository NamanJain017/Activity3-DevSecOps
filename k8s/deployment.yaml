apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-web
  namespace: activity3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthcare-web
  template:
    metadata:
      labels:
        app: healthcare-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: healthcare
          image: irontiger0000007/activity3healthcare:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: nginx-tmp
          emptyDir: {}
